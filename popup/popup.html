<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>即时翻译</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h1>即时翻译</h1>
    <p id="status"></p>
    <div class="actions">
      <button id="translate" class="primary">翻译当前页</button>
      <button id="toggle">显示 / 隐藏译文</button>
      <button id="stop">停止翻译</button>
    </div>
    <hr />
    <div class="row between">
      <span class="hint">本站规则 <code id="site-host">—</code></span>
      <button id="clear-site-rule" class="link">清除</button>
    </div>
    <div class="actions">
      <button id="exclude-region">排除选中区域</button>
      <button id="include-region">只翻译选中区域</button>
    </div>
    <label class="row hint small">
      <input type="checkbox" id="site-incremental" />
      <span>本站自动翻译新增内容</span>
    </label>
    <p id="rule-status" class="hint small"></p>
    <hr />
    <div class="row between">
      <span class="hint">快捷键 <kbd id="shortcut">读取中…</kbd></span>
      <button id="options" class="link">设置</button>
    </div>
    <p id="shortcut-warning" class="warn" hidden></p>
    <p class="hint small">
      想换键位？<a href="#" id="open-shortcuts">打开快捷键设置</a>
      <span id="shortcut-fallback"></span>
    </p>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
